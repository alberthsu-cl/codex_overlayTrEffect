<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Codex-Driven Flow</title>
  <desc id="desc">Codex interprets and edits a transition candidate. Command-driven local tools prepare inputs, build, render, score, report, and promote the same FX ID.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#233044"/>
    </marker>
    <style>
      .bg { fill: #f7f8fa; }
      .band { fill: #eef2f7; stroke: #d6dde8; stroke-width: 1; }
      .codex { fill: #f2eaff; stroke: #7048a8; stroke-width: 2.5; rx: 12; ry: 12; }
      .command { fill: #e8f3ff; stroke: #23639b; stroke-width: 2.5; rx: 12; ry: 12; }
      .artifact { fill: #effaf1; stroke: #2c7a4b; stroke-width: 2.5; rx: 12; ry: 12; }
      .decision { fill: #fff7e6; stroke: #a46a00; stroke-width: 2.5; rx: 12; ry: 12; }
      .title { font: 700 32px "Segoe UI", Arial, sans-serif; fill: #152238; }
      .band-title { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #34445b; }
      .text { font: 20px "Segoe UI", Arial, sans-serif; fill: #172235; }
      .small { font: 17px "Segoe UI", Arial, sans-serif; fill: #42526a; }
      .caption { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #42526a; }
      .legend { font: 600 17px "Segoe UI", Arial, sans-serif; fill: #233044; }
      .line { fill: none; stroke: #233044; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #7048a8; stroke-width: 3; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>
  <text class="title" x="50" y="52">Codex-Driven Flow</text>
  <text class="small" x="50" y="82">One registered FX ID is refined in an isolated workspace; local commands provide deterministic evaluation.</text>

  <rect class="codex" x="1040" y="32" width="210" height="42"/>
  <text class="legend" x="1145" y="59" text-anchor="middle">Codex inference / editing</text>
  <rect class="command" x="1270" y="32" width="210" height="42"/>
  <text class="legend" x="1375" y="59" text-anchor="middle">Command-driven tools</text>
  <rect class="artifact" x="1500" y="32" width="210" height="42"/>
  <text class="legend" x="1605" y="59" text-anchor="middle">Artifact / source</text>

  <rect class="band" x="30" y="115" width="1740" height="235" rx="16"/>
  <text class="band-title" x="55" y="150"> Understand the sample</text>

  <rect class="command" x="55" y="185" width="250" height="105"/>
  <text class="text" x="180" y="225" text-anchor="middle">Prepare video</text>
  <text class="small" x="180" y="255" text-anchor="middle">normalize / extract frames</text>

  <rect class="codex" x="355" y="185" width="250" height="105"/>
  <text class="text" x="480" y="225" text-anchor="middle">Codex video</text>
  <text class="text" x="480" y="253" text-anchor="middle">analysis</text>

  <rect class="artifact" x="655" y="185" width="250" height="105"/>
  <text class="text" x="780" y="225" text-anchor="middle">transition_</text>
  <text class="text" x="780" y="253" text-anchor="middle">analysis.json</text>

  <rect class="command" x="955" y="185" width="250" height="105"/>
  <text class="text" x="1080" y="225" text-anchor="middle">Prepare source</text>
  <text class="small" x="1080" y="255" text-anchor="middle">A/B frames + reference</text>

  <rect class="codex" x="1255" y="185" width="250" height="105"/>
  <text class="text" x="1380" y="225" text-anchor="middle">Codex effect</text>
  <text class="text" x="1380" y="253" text-anchor="middle">design and tuning</text>

  <rect class="artifact" x="1555" y="185" width="180" height="105"/>
  <text class="text" x="1645" y="225" text-anchor="middle">effect_</text>
  <text class="text" x="1645" y="253" text-anchor="middle">design.json</text>

  <path class="line" d="M305 237 H355"/>
  <path class="line" d="M605 237 H655"/>
  <path class="line" d="M906 237 H955"/>
  <path class="line" d="M1205 237 H1255"/>
  <path class="line" d="M1505 237 H1555"/>

  <rect class="band" x="30" y="380" width="1740" height="235" rx="16"/>
  <text class="band-title" x="55" y="415">Candidate setup</text>

  <rect class="decision" x="55" y="450" width="250" height="105"/>
  <text class="text" x="180" y="490" text-anchor="middle">Reuse / tune</text>
  <text class="small" x="180" y="520" text-anchor="middle">keep the active FX ID</text>

  <rect class="command" x="355" y="450" width="250" height="105"/>
  <text class="text" x="480" y="490" text-anchor="middle">candidate-init</text>
  <text class="small" x="480" y="520" text-anchor="middle">copy registered source</text>

  <rect class="artifact" x="655" y="450" width="250" height="105"/>
  <text class="text" x="780" y="490" text-anchor="middle">Candidate workspace</text>
  <text class="small" x="780" y="520" text-anchor="middle">agent/work/candidates/...</text>

  <rect class="codex" x="955" y="450" width="250" height="105"/>
  <text class="text" x="1080" y="490" text-anchor="middle">Codex edits</text>
  <text class="text" x="1080" y="520" text-anchor="middle">C++ / HLSL candidate</text>

  <rect class="artifact" x="1255" y="450" width="250" height="105"/>
  <text class="text" x="1380" y="490" text-anchor="middle">Candidate source</text>
  <text class="small" x="1380" y="520" text-anchor="middle">same FX ID, new iteration</text>

  <path class="line" d="M305 502 H355"/>
  <path class="line" d="M605 502 H655"/>
  <path class="line" d="M906 502 H955"/>
  <path class="line" d="M1205 502 H1255"/>
  <path class="line" d="M1645 290 V345 H180 V450"/>

  <rect class="band" x="30" y="645" width="1740" height="265" rx="16"/>
  <text class="band-title" x="55" y="680">Deterministic evaluation loop</text>

  <rect class="command" x="55" y="715" width="250" height="105"/>
  <text class="text" x="180" y="755" text-anchor="middle">Build DLL</text>
  <text class="small" x="180" y="785" text-anchor="middle">compile candidate</text>

  <rect class="command" x="355" y="715" width="250" height="105"/>
  <text class="text" x="480" y="755" text-anchor="middle">Render</text>
  <text class="small" x="480" y="785" text-anchor="middle">headless renderer</text>

  <rect class="command" x="655" y="715" width="250" height="105"/>
  <text class="text" x="780" y="755" text-anchor="middle">Score</text>
  <text class="small" x="780" y="785" text-anchor="middle">frame alignment + metrics</text>

  <rect class="artifact" x="955" y="715" width="250" height="105"/>
  <text class="text" x="1080" y="755" text-anchor="middle">Regression report</text>
  <text class="small" x="1080" y="785" text-anchor="middle">render + score artifacts</text>

  <rect class="decision" x="1255" y="715" width="250" height="105"/>
  <text class="text" x="1380" y="755" text-anchor="middle">Review result</text>
  <text class="small" x="1380" y="785" text-anchor="middle">accept, refine, or stop</text>

  <rect class="command" x="1555" y="715" width="180" height="105"/>
  <text class="text" x="1645" y="755" text-anchor="middle">Promote</text>
  <text class="small" x="1645" y="785" text-anchor="middle">backup + replace</text>

  <path class="line" d="M1255 502 V665 H180 V715"/>
  <path class="line" d="M305 767 H355"/>
  <path class="line" d="M605 767 H655"/>
  <path class="line" d="M905 767 H955"/>
  <path class="line" d="M1205 767 H1255"/>
  <path class="line" d="M1505 767 H1555"/>

  <path class="loop" d="M1380 715 V635 H1080 V555"/>
  <text class="caption" x="1110" y="625" text-anchor="middle">Codex reads the report and refines the candidate</text>

  <path class="line" d="M1645 820 V865 H1645 V955"/>
  <rect class="artifact" x="1505" y="955" width="280" height="80"/>
  <text class="text" x="1645" y="988" text-anchor="middle">Validated active FX ID</text>
  <text class="small" x="1645" y="1016" text-anchor="middle">ModelGenerated\\CandidateFxID_xx</text>

  <text class="caption" x="55" y="1080">Codex owns interpretation and source edits. Commands own preparation, build, rendering, scoring, backups, and reports.</text>
</svg>
